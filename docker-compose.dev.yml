# ─────────────────────────────────────────────────────────────────────
# NASPilot — 本地开发 / 验证栈（不重新构建镜像）
#
# 直接复用已发布镜像，把工作区源码与前端构建产物挂载进去：
#   backend/app          → /app/backend/app        （Python 源码热替换）
#   frontend/dist        → /app/backend/frontend/dist（前端静态文件）
#
# 启动：
#   docker compose -f docker-compose.dev.yml up -d
# 停止：
#   docker compose -f docker-compose.dev.yml down
#
# 说明：镜像里没有 ffmpeg / yt-dlp 时，用一次 exec 装进运行中的容器即可
#       （容器重建后需要重装；正式镜像已在 Dockerfile 中内置）。
#   docker exec naspilot-dev bash -lc "apt-get update && apt-get install -y ffmpeg && python -m pip install -U yt-dlp"
# ─────────────────────────────────────────────────────────────────────
name: naspilot-dev

services:
  naspilot:
    image: ghcr.io/jiafok/naspilot:latest
    pull_policy: never
    container_name: naspilot-dev
    restart: unless-stopped

    ports:
      - "8082:8082"

    volumes:
      # 源码挂载（只读，避免容器改写工作区）
      - ./backend/app:/app/backend/app:ro
      - ./frontend/dist:/app/backend/frontend/dist:ro
      # 持久化数据（SQLite + 日志）
      - ./data:/app/data
      # 媒体下载目录（容器内固定 /Media，其下自动派生 Video/ 与 Audio/）
      - ./data/media:/Media
      # 容器管理
      - /var/run/docker.sock:/var/run/docker.sock:rw

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/naspilot.db
      - SECRET_KEY=dev-only-secret-key-please-change-32chars-long
      - FIRST_ADMIN_PASSWORD=admin123
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      # ── 媒体下载中心：验证阶段限制单次数量，避免一次拉太多 ──
      - MEDIA_MAX_PER_SYNC=3
      - MEDIA_SCAN_LIMIT=15
      # ── 网络：视频 CDN（googlevideo.com）被阻断时必须配置代理 ──
      # 宿主机上的代理（Clash/v2ray 等）需开启「允许局域网连接」，
      # 对容器而言地址是 host.docker.internal
      # - MEDIA_PROXY_URL=http://host.docker.internal:7890
      #   SOCKS5 亦可：socks5://host.docker.internal:7891
      # 也可以直接让所有出网流量走代理（yt-dlp 会自动读取）：
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # 部分来源的签名需要 JS 运行时（镜像已内置 node）
      # - MEDIA_JS_RUNTIMES=node
      # ── 媒体下载中心 ──
      - MEDIA_MAX_CONCURRENT=2
      - MEDIA_DEFAULT_VIDEO_HEIGHT=480
      # network_mode=system 时使用的全局代理（可留空，按订阅单独设置）
      # - MEDIA_PROXY_URL=http://host.docker.internal:7890
      # 媒体服务器（用于「打开媒体库」跳转，可留空）
      # - EMBY_URL=http://192.168.1.10:8096
      # - JELLYFIN_URL=http://192.168.1.10:8096
      # - AUDIOBOOKSHELF_URL=http://192.168.1.10:13378

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
