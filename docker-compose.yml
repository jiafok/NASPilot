# ==========================================================
# NASPilot — NAS 部署（群晖 / 威联通，host 网络）
#
# 用法：
#   1. 把下面两处路径改成你的实际路径
#   2. docker compose up -d
#   3. 浏览器打开  http://<NAS-IP>:8082
#
# 不需要建 .env，也不需要设置密钥：首次启动会自动生成
# 并保存到 data/secret_key，之后一直复用。
# 镜像里已经装好 yt-dlp / ffmpeg，也自带健康检查；环境变量全部有默认值。
# ==========================================================

services:
  naspilot:
    image: ghcr.io/jiafok/naspilot:latest
    pull_policy: always
    container_name: naspilot
    restart: unless-stopped

    # host 网络 = 直接占用 NAS 的 8082 端口，所以不需要 ports 段
    network_mode: host

    volumes:
      # ── 必须 1：数据库和配置 ─────────────────────────────
      - ./data:/app/data

      # ── 必须 2：下载的媒体文件 ───────────────────────────
      # 把 /volume1 换成你的媒体盘。容器内固定用 /Media，
      # 其下自动建 Video/ 与 Audio/。容器内的根目录可在
      # 「系统设置 → 媒体」里改，不需要动这个文件。
      - /volume1/media:/Media

      # ── 英语学习媒体库：就在 /Media/English ───────────────
      # 层级：<频道>/<课程>/<课时>.mp4|.mp3（同名 .srt/.vtt 自动绑定）
      # 放进文件后在网页「英语学习 → 扫描媒体库」即可，无需额外挂载。
      # 想单独放一块盘：加 - /volume1/English:/English
      #                并设 ENGLISH_ROOT=/English

      # ── 可选：容器管理 / 定时任务 / 备份 ─────────────────
      # 用不到这些功能，可以把下面 4 行整段删掉
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./scripts:/scripts:ro
      - /volume1/docker:/volume1/docker:ro
      - /volumeUSB1/usbshare/docker_backup:/volumeUSB1/usbshare/docker_backup:rw

    environment:
      # 数据库自动落在 /app/data/naspilot.db，不用指定
      - TZ=Asia/Shanghai

      # ── 以下都可选，不写就用默认值 ───────────────────────
      # - FIRST_ADMIN_PASSWORD=admin123       # 留空 = 首次启动随机生成
      # - MEDIA_PROXY_URL=http://192.168.1.10:7890
      # - MEDIA_DEFAULT_VIDEO_HEIGHT=1080     # 默认 480，0 = 原画
      # - ENGLISH_ROOT=/Media/English         # 留空即此值

    # 日志轮转：防止日志把磁盘写满（单个 10MB，最多留 3 个）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
