# ============================================================
# NASPilot — NAS 部署（Synology/群晖 等，host 网络）
#
# 用途：群晖 / 威联通等 NAS 上直接拉 GHCR 镜像运行（host 网络）。
#       本文件不编译源码；要自己构建请用 docker-compose.deploy.yml。
#
# 升级到 Media Download Center 版本：
#   1. 备份 data/naspilot.db
#   2. docker compose down
#   3. docker compose pull && docker compose up -d
#
# ⚠ 必须保留 /Media 挂载，否则容器重建后已下载的文件会全部丢失。
# ============================================================

services:
  naspilot:
    image: ghcr.io/jiafok/naspilot:latest
    pull_policy: always
    container_name: naspilot
    restart: unless-stopped

    network_mode: "host"

    # ports:  ← not needed with host networking; container uses host's 8082 directly
    #   - "8080:8000"

    volumes:
      # Persistent data (SQLite + logs + configs)
      - ./data:/app/data
      # Optional: separate logs directory (logs now go to /app/data/logs/)
      # - ./logs:/app/logs
      # Docker socket (manage containers)
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Your scripts directory
      - ./scripts:/scripts:ro
      # Docker app backup (read)
      - /volume1/docker:/volume1/docker:ro
      # Docker app backup (write)
      - /volumeUSB1/usbshare/docker_backup:/volumeUSB1/usbshare/docker_backup:rw
      # ── 媒体下载（只需这一个挂载点）────────────────────────────
      # 容器内会自动往下建 Video/ 和 Audio/ 两个子目录，
      # 盘上结构： <宿主机目录>/Video/youtube/<频道>/...mp4
      #            <宿主机目录>/Audio/podcast/<播客>/...mp3
      - ${NAS_MEDIA_ROOT:-./data/media}:/Media
      # 旧版 YouTube 页面（已弃用，不需要可删掉这两行）
      - ${NAS_MEDIA_ROOT:-./data/media}/Video:/media/Youtube
      - ${NAS_MEDIA_ROOT:-./data/media}/Audio:/media/Audio

    # Optional: rclone mount requires FUSE
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse:/dev/fuse
    # volumes:
    #   - /path/to/rclone.conf:/app/.config/rclone/rclone.conf:ro

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/naspilot.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - run openssl rand -hex 32}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-}
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

      # ── 下面全是可选项，不写就用默认值 ──────────────────────────
      # 目录（默认已对齐，无需设置）
      #   MEDIA_VIDEO_DIR=/Media/Video   MEDIA_AUDIO_DIR=/Media/Audio
      # 清晰度 / 并发 / 单次上限（默认 480 / 2 / 20）
      # - MEDIA_DEFAULT_VIDEO_HEIGHT=1080     # 0 = 原画
      # - MEDIA_MAX_CONCURRENT=2
      # - MEDIA_MAX_PER_SYNC=20
      # 全局代理：不设则直连；也可在单个订阅里单独设置出网方式
      # - MEDIA_PROXY_URL=http://192.168.1.10:7890
      # 媒体服务器：仅用于生成「在 Emby/Jellyfin 打开」的跳转按钮，
      # 不影响下载。不用就整段删掉。
      # - EMBY_URL=http://192.168.1.10:8096
      # - JELLYFIN_URL=http://192.168.1.10:8096
      # - AUDIOBOOKSHELF_URL=http://192.168.1.10:13378
      # 旧版 YouTube 页面相关（已弃用，可删）
      - YOUTUBE_VIDEO_DIR=/media/Youtube
      - YOUTUBE_AUDIO_DIR=/media/Audio

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
