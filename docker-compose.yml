# ============================================================
# NASPilot — NAS 部署（Synology/群晖 等，host 网络）
#
# 升级到 Media Download Center 版本：
#   1. 备份 data/naspilot.db
#   2. docker compose down
#   3. docker compose build && docker compose up -d
#      （或改用 GHCR 镜像，见下面 image/ 行）
#
# ⚠ 媒体下载中心必须挂载 /Media/Video 与 /Media/Audio，
#   否则容器重建后已下载的文件会全部丢失。
# ============================================================

services:
  naspilot:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/jiafok/naspilot:latest  ← uncomment after pushing to GHCR
    pull_policy: build
    container_name: naspilot
    restart: unless-stopped

    network_mode: "host"

    # ports:  ← not needed with host networking; container uses host's 8082 directly
    #   - "8080:8000"

    volumes:
      # Persistent data (SQLite + logs + configs)
      - ./data:/app/data
      # Optional: separate logs directory (logs now go to /app/data/logs/)
      # - ./logs:/app/logs
      # Docker socket (manage containers)
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Your scripts directory
      - ./scripts:/scripts:ro
      # Docker app backup (read)
      - /volume1/docker:/volume1/docker:ro
      # Docker app backup (write)
      - /volumeUSB1/usbshare/docker_backup:/volumeUSB1/usbshare/docker_backup:rw
      # ── 媒体下载中心（Media Download Center，新版）───────────────
      # 宿主机路径可用环境变量覆盖，群晖建议绝对路径：
      #   NAS_MEDIA_VIDEO=/volume1/media/Video
      #   NAS_MEDIA_AUDIO=/volume1/media/Audio
      - ${NAS_MEDIA_VIDEO:-./data/media/Video}:/Media/Video
      - ${NAS_MEDIA_AUDIO:-./data/media/Audio}:/Media/Audio
      # ── 旧版 YouTube 页面（已弃用，仅保留兼容）──────────────────
      # 指向同一宿主机目录，避免两套路径各存一份。
      - ${NAS_MEDIA_VIDEO:-./data/media/Video}:/media/Youtube
      - ${NAS_MEDIA_AUDIO:-./data/media/Audio}:/media/Audio

    # Optional: rclone mount requires FUSE
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse:/dev/fuse
    # volumes:
    #   - /path/to/rclone.conf:/app/.config/rclone/rclone.conf:ro

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/naspilot.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required - run openssl rand -hex 32}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-}
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # ── 媒体下载中心（新版）────────────────────────────────────
      - MEDIA_VIDEO_DIR=/Media/Video
      - MEDIA_AUDIO_DIR=/Media/Audio
      - MEDIA_DEFAULT_VIDEO_HEIGHT=${MEDIA_DEFAULT_VIDEO_HEIGHT:-480}
      - MEDIA_MAX_CONCURRENT=${MEDIA_MAX_CONCURRENT:-2}
      - MEDIA_MAX_PER_SYNC=${MEDIA_MAX_PER_SYNC:-20}
      - MEDIA_SCAN_LIMIT=${MEDIA_SCAN_LIMIT:-100}
      # 全局代理；也可在单个订阅里单独设置（编辑订阅 → 出网方式）
      # - MEDIA_PROXY_URL=http://192.168.1.10:7890
      # 媒体服务器（填了会在「历史记录」里生成直达链接）
      # - EMBY_URL=http://192.168.1.10:8096
      # - JELLYFIN_URL=http://192.168.1.10:8096
      # - AUDIOBOOKSHELF_URL=http://192.168.1.10:13378

      # ── 旧版 YouTube 页面（已弃用，可整段删除）──────────────────
      - YOUTUBE_VIDEO_DIR=/media/Youtube
      - YOUTUBE_AUDIO_DIR=/media/Audio
      # - YOUTUBE_COOKIES_FILE=/app/data/cookies.txt
      # - YOUTUBE_PROXY=http://host:port
      # - YOUTUBE_JS_RUNTIMES=node

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
