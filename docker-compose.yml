# ==========================================================
# NASPilot — NAS 部署（群晖 / 威联通，host 网络）
#
# 用法：
#   1. 把下面两处路径改成你的实际路径
#   2. docker compose up -d
#   3. 浏览器打开  http://<NAS-IP>:8082
#
# 不需要建 .env，也不需要设置密钥：首次启动会自动生成
# 并保存到 data/secret_key，之后一直复用。
# 镜像里已经装好 yt-dlp / ffmpeg，也自带健康检查；环境变量全部有默认值。
# ==========================================================

services:
  naspilot:
    image: ghcr.io/jiafok/naspilot:latest
    pull_policy: always
    container_name: naspilot
    restart: unless-stopped

    # host 网络 = 直接占用 NAS 的 8082 端口，所以不需要 ports 段
    network_mode: host

    volumes:
      # ── 唯一必须的挂载：数据库 + 日志 + 媒体文件 ───────────
      # 媒体在 data/media（容器内 /app/data/media），媒体中心与英语学习
      # 共用这一份，不需要再挂 /Media。
      - ./data:/app/data

      # ── 可选：容器管理 / 脚本任务 / 访问 NAS 上的其他目录 ───
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - ./scripts:/scripts:ro
      # 群晖存储池（只读）。覆盖 /volume1/docker，Btrfs 清理也靠它找 subvolume。
      - /volume1:/volume1:ro
      # U 盘 / 外接盘（可写）。**必须挂在与宿主机相同的路径上**：
      # 「Docker 备份」插件的默认目标是 /volumeUSB1/usbshare/docker_backup，
      # 如果这里改挂成 /usb，容器里那个路径就不存在了 —— 插件会用 makedirs
      # 自己建一个，备份看起来成功，实际写进容器临时层，重建容器即丢。
      - /volumeUSB1/usbshare:/volumeUSB1/usbshare:rw

    environment:
      - TZ=Asia/Shanghai
      # ── 以下都可选，不写就用默认值 ───────────────────────
      # - FIRST_ADMIN_PASSWORD=admin123       # 留空 = 首次启动随机生成
      # - MEDIA_PROXY_URL=http://192.168.1.10:7890
      # - MEDIA_DEFAULT_VIDEO_HEIGHT=1080     # 默认 480，0 = 原画
      # - MEDIA_ROOT=/volume1/media           # 留空 = data/media
      # - ENGLISH_ROOT=/Media/English         # 留空 = 复用媒体库

    # 日志轮转：防止日志把磁盘写满（单个 10MB，最多留 3 个）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
