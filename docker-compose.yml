version: "3.9"

services:
  naspilot:
    build:
      context: .
      dockerfile: Dockerfile
    # image: ghcr.io/jiafok/naspilot:latest  ← uncomment after pushing to GHCR
    pull_policy: build
    container_name: naspilot
    restart: unless-stopped

    network_mode: "host"

    # ports:  ← not needed with host networking; container uses host's 8082 directly
    #   - "8080:8000"

    volumes:
      # Persistent data (SQLite + logs + configs)
      - ./data:/app/data
      # Optional: separate logs directory (logs now go to /app/data/logs/)
      # - ./logs:/app/logs
      # Docker socket (manage containers)
      - /var/run/docker.sock:/var/run/docker.sock:rw
      # Your scripts directory
      - ./scripts:/scripts:ro
      # Docker app backup (read)
      - /volume1/docker:/volume1/docker:ro
      # Docker app backup (write)
      - /volumeUSB1/usbshare/docker_backup:/volumeUSB1/usbshare/docker_backup:rw
      # ── Media Subscription Center (YouTube) ──────────────────────
      # Host side is configurable; inside the container always /media/*.
      # Synology example:  - /volume1/media/Youtube:/media/Youtube
      - ${NAS_MEDIA_VIDEO:-./data/media/Youtube}:/media/Youtube
      - ${NAS_MEDIA_AUDIO:-./data/media/Audio}:/media/Audio

    # Optional: rclone mount requires FUSE
    # cap_add:
    #   - SYS_ADMIN
    # devices:
    #   - /dev/fuse:/dev/fuse
    # volumes:
    #   - /path/to/rclone.conf:/app/.config/rclone/rclone.conf:ro

    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/naspilot.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required — generate with: openssl rand -hex 32}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-}
      - TZ=Asia/Shanghai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Media Subscription Center
      - YOUTUBE_VIDEO_DIR=/media/Youtube
      - YOUTUBE_AUDIO_DIR=/media/Audio
      - YOUTUBE_SYNC_INTERVAL_HOURS=${YOUTUBE_SYNC_INTERVAL_HOURS:-6}
      - YOUTUBE_MAX_PER_SYNC=${YOUTUBE_MAX_PER_SYNC:-20}
      # Optional: --cookies file / proxy / JS runtime (e.g. "node")
      # - YOUTUBE_COOKIES_FILE=/app/data/cookies.txt
      # - YOUTUBE_PROXY=http://host:port
      # - YOUTUBE_JS_RUNTIMES=node

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
